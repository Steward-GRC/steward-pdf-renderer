---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pdfrenders.renders.steward-grc.com
spec:
  group: renders.steward-grc.com
  names:
    kind: PdfRender
    listKind: PdfRenderList
    plural: pdfrenders
    singular: pdfrender
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.policyVersionId
      name: PolicyVersion
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PdfRender asks for one document version to be rendered to PDF.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PdfRenderSpec is the desired state of one PDF render.

              The operator builds the Job from the spec when the resource is first
              reconciled; later edits don't reach a Job that already exists. Deleting the
              resource cancels the render: the Job goes with it through its owner
              reference.
            properties:
              fetchURL:
                description: |-
                  FetchURL is the URL the renderer GETs for the HTML to print. It must be
                  reachable from the Job's pod.
                type: string
              outputBucket:
                description: |-
                  OutputBucket is the object-storage bucket the PDF is uploaded to. The
                  operator doesn't check that it exists; a failed upload fails the Job.
                type: string
              outputKey:
                description: |-
                  OutputKey is the object key for the PDF. The caller picks it and keeps
                  it unique.
                type: string
              policyVersionId:
                description: |-
                  PolicyVersionID identifies the document version being rendered. It is
                  recorded for correlation only; the renderer fetches FetchURL.
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the requester's user id, printed in the sensitive
                  watermark. Informational only: the operator authenticates nothing
                  against it.
                type: string
              sensitivity:
                default: standard
                description: |-
                  Sensitivity selects the watermark: "standard" has none, "sensitive"
                  draws the requester and the time diagonally on every page.
                enum:
                - standard
                - sensitive
                type: string
              trace:
                description: |-
                  Trace is the caller's trace id, passed to the renderer so its logs
                  correlate with the request that asked for the PDF.
                type: string
            required:
            - fetchURL
            - outputBucket
            - outputKey
            - policyVersionId
            type: object
          status:
            description: |-
              PdfRenderStatus is the observed state of a PdfRender. Only the operator
              writes it.
            properties:
              completeTime:
                description: CompleteTime is when the render reached Succeeded or
                  Failed.
                format: date-time
                type: string
              conditions:
                description: Conditions are the standard Progressing and Ready conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              error:
                description: |-
                  Error is a short reason when Phase is Failed. The detail is in the Job
                  pod's logs, kept until the Job's TTL runs out.
                type: string
              outputURL:
                description: OutputURL is the s3:// URI of the PDF once Phase is Succeeded.
                type: string
              phase:
                description: |-
                  Phase moves Pending, Running, then Succeeded or Failed. Empty means the
                  operator hasn't reconciled the resource yet.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startTime:
                description: StartTime is when the operator created the Job.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
